name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Build portable Windows x64 app
        shell: pwsh
        run: ./build.ps1 -Publish
      - name: Check localization
        run: dotnet run --project ./AndroidDesk.Smoke -- --language
      - name: Check Wi-Fi input validation
        run: dotnet run --project ./AndroidDesk.Smoke -- --wifi-validation
      - name: Upload portable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scrcpy-gui-windows-x64
          path: dist/AndroidDesk/
          if-no-files-found: error
          retention-days: 7
