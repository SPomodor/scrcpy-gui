name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows ${{ matrix.architecture }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Select package version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = 'dev'
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw 'Use a version tag such as v1.0.0 or v1.0.0-rc.1.' }
            $version = $Matches[1]
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build, validate and archive portable app
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
        run: ./scripts/New-ReleasePackage.ps1 -Architecture $env:TARGET_ARCH -Version $env:PACKAGE_VERSION
      - name: Check localization
        if: matrix.architecture == 'x64'
        run: dotnet run --project ./AndroidDesk.Smoke -- --language
      - name: Check Wi-Fi input validation
        if: matrix.architecture == 'x64'
        run: dotnet run --project ./AndroidDesk.Smoke -- --wifi-validation
      - name: Check file-drop events
        if: matrix.architecture == 'x64'
        run: dotnet run --project ./AndroidDesk.Smoke -- --file-validation
      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-${{ matrix.architecture }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: portable-*
          merge-multiple: true
          path: release
      - name: Verify all archives and publish
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          cat ./*.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          args=(--repo "$GH_REPO" --verify-tag --title "scrcpy GUI $RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS.txt --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" ./*.zip SHA256SUMS.txt "${args[@]}"
          fi
